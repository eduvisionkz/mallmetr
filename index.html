<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MalMetr</title>
  <meta name="description" content="MalMetr — мал салмағының математикалық моделі: қойдың болжамды салмағын фото немесе L және D өлшемдері арқылы анықтау">
  <meta name="theme-color" content="#FAF7EC">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MalMetr">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Тақырыпты бет жүктелмей тұрып орнату (жыпылықтамау үшін)
    try {
      var t = localStorage.getItem('malmetr-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <button class="icon-btn" id="backBtn" aria-label="Артқа" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="topbar-title" id="topbarTitle">MalMetr</div>
      <button class="icon-btn" id="themeBtn" aria-label="Тақырыпты ауыстыру">
        <svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>
      </button>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Негізгі мәзір">
      <a href="#/advanced" data-route="advanced">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Басты</span>
      </a>
      <a href="#/scan" data-route="scan">
        <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3.2"/></svg>
        <span>Сканер</span>
      </a>
      <a href="#/model" data-route="model">
        <svg viewBox="0 0 24 24"><path d="M5 19L19 5M7 5h4M9 3v4M14 17h5M5 14l4 4M9 14l-4 4"/></svg>
        <span>Модель</span>
      </a>
      <a href="#/lab" data-route="lab">
        <svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 15h9"/></svg>
        <span>Зертхана</span>
      </a>
      <a href="#/results" data-route="results">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Нәтиже</span>
      </a>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle"></div>
    <div id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="printArea" class="print-area" aria-hidden="true"></div>

  <noscript>MalMetr жұмыс істеуі үшін JavaScript қосулы болуы керек.</noscript>
  <script src="vendor/qrcode.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
